# Обязанности — абстрактные роли «тот, кто …»: одна обязанность — один ответственный (single responsibility).
# Упоминание в тексте: [[oby.oplata]]. Шаги процессов ссылаются на обязанности (pro/*/protsess.yaml: delaet, stavit…).
#
# Поля: title — кто это («Оплачивающий счета»); polno — за что отвечает одной фразой;
# predpolagaem — какая должность (reg/rol.yaml), по нашей догадке, выполняет; пусто — не знаем;
# kontur; gde — места работы, если шагов в процессах нет (иначе места собираются из шагов);
# istochnik; pochemu — почему выделили отдельно; dogadka — что не подтверждено; status.
# Переназначить обязанность другой должности = поменять predpolagaem. Разделить = завести новую и перенести шаги.

