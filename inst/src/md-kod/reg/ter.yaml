# Термины: короткие определения, которым не нужна своя страница.
# Упоминание в тексте: [[ter.kp]]. Записи взяты из второй попытки — каждую надо проверить.

nmts:
  title: "НМЦ"
  polno: "Начальная (максимальная) цена договора – сумма, которая указывается в извещении о тендере. Не содержит налоги и сборы."
  status: проверить

okpd2:
  title: "ОКПД 2"
  polno: "Общероссийский классификатор продукции по видам экономической деятельности. Код ОКПД 2 используется для классификации товаров и услуг в тендерах."
  status: проверить

kp:
  title: "КП"
  polno: "Коммерческое предложение – ответ поставщика на запрос, содержащий цену, сроки поставки, условия."
  status: проверить

crm:
  title: "CRM"
  polno: "CRM (Customer Relationship Management) – система для управления сделками, клиентами, смарт-процессами. В проекте используется Битрикс24."
  status: проверить

smart-protsess:
  title: "Смарт-процесс"
  polno: "Смарт-процесс – гибкий инструмент Битрикс24 для управления бизнес-процессами. В проекте используется смарт-процесс 'Расчет' для управления тендерами."
  status: проверить

tender:
  title: "Тендер"
  polno: "Тендер – процедура конкурентной закупки товаров или услуг. В проекте работают с государственными и коммерческими тендерами."
  status: проверить

postavshchik:
  title: "Поставщик"
  polno: "Поставщик – организация, которая производит или продает товары. В проекте работаем с заводами-изготовителями и их дилерами."
  status: проверить

