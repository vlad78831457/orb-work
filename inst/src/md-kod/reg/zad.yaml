# Группы задач: что делает роль, кусками. Упоминание в тексте: [[zad.zak-oformlenie]].
# rol — кто исполняет сейчас. Перегруппировать = поменять rol (или перенести шаг в другую группу).
#
# Поля: title, polno — карточка; rol — исполнитель; pomogayut, soglasuyut, uznayut — другие роли
# (соисполнитель / с кем согласуют / кого уведомляют — как в регламенте); kontur; listy — листы таблиц;
# shagi — откуда шаги (источник: номера шагов или стадии); pochemu — почему выделили в группу;
# dogadka — что не подтверждено; status.
# Источники — в шапке reg/rol.yaml. «Регламент, Закупка 6–8» = процесс «Закупка товара», шаги 6–8.

# --- Контур 0: управление (менеджер проекта) ---

men-kontraktatsiya:
  title: "Заключение договора с заказчиком"
  polno: "Связаться с заказчиком, получить проект договора, поставить задачи на проверку договора и ТЗ, довести до подписания и передать договор в исполнение."
  rol: proekt
  pomogayut: [tekh, kaznachey]
  kontur: "0"
  listy: ["0-Паспорт проекта, раздел «Контрактация»"]
  shagi: ["регламент, Передача в контрактацию 0–4", "регламент, Контрактация 5–20"]
  pochemu: "Отдельный процесс в регламенте, идёт до закупки; почти всё делает менеджер, ТС проверяет ТЗ (шаг 12), проверку договора делает столбец K (шаг 10)."
  dogadka: "Подписание через ЭДО (шаг 15) делает столбец M — записано в группу kazn-oplata."
  status: проверить

men-pasport:
  title: "Паспорт расчёта и решение о тех. экспертизе"
  polno: "Заполнить паспорт в смарт-процессе «Расчет» и решить, нужна ли техническая экспертиза."
  rol: proekt
  uznayut: [rukovoditel]
  kontur: "0"
  listy: ["0-Паспорт проекта"]
  shagi: ["смарт-процесс, стадии «Заполнить паспорт проекта», «Принять решение о необходимости экспертизы»"]
  pochemu: "В смарт-процессе это две задачи менеджера; обе — решения на входе в расчёт."
  status: проверить

men-peredacha:
  title: "Передача проекта в закупку"
  polno: "Заполнить лист 5-0 как в договоре, проверить комплектность, поставить и принять задачу на закупку; при необходимости — возобновить закупку."
  rol: proekt
  pomogayut: [tekh]
  kontur: "2 — вход"
  listy: ["5-0 Передача в закупку"]
  shagi: ["регламент, Передача в закупки 0–7"]
  pochemu: "Директор: менеджер проекта фиксирует лист 5-0 и передаёт его закупщику. В регламенте — отдельный процесс, все шаги у менеджера; ТС формирует требования к технической документации (шаг 3)."
  dogadka: "Решение передать проект в закупки (шаг 0) принимает «менеджер по продажам или РОП» — может быть другой ролью."
  status: проверить

men-resheniya-zakupki:
  title: "Решения по ходу закупки"
  polno: "Следить за комментариями закупщика и результатами повторной рассылки, решать о замене поставщика и о сделке, решать по эскалированным проблемам поставки."
  rol: proekt
  uznayut: [zakupka]
  kontur: "2"
  listy: ["5-3 Выбор поставщиков Закупки", "5-5 Оформление сделок"]
  shagi: ["регламент, Закупка 4, 5, 10", "регламент, Поступление 8"]
  pochemu: "Эти шаги стоят внутри процесса закупки, но исполняет их менеджер. Выделены, чтобы не смешивать решения с работой закупщика."
  dogadka: "Шаги 4–5 в регламенте помечены «будет пересмотрен под изменение таблицы в части закупок»."
  status: проверить

men-kommercheskaya:
  title: "Коммерческая часть КП и ТКП"
  polno: "Анализ выбора поставщиков на листе 3-3, итоговая сумма и проверки цен на листе 4-3, подготовка КП для процедуры."
  rol: proekt
  pomogayut: [tekh]
  kontur: "1"
  listy: ["3-3 Выбор поставщиков", "4-2 Подготовка КП", "4-3 Подготовка ТКП"]
  shagi: ["3.1.6: «менеджер отвечает за коммерческую часть»", "список инструкций, п. 4, 7"]
  pochemu: "Расчётная работа менеджера; на листе 4-3 его часть прямо отделена от части ТС."
  dogadka: "Источники — старые инструкции (3.1.4–3.1.6), не из списка самых точных."
  status: проверить

men-ispolnenie:
  title: "План исполнения и контроль заказчика"
  polno: "План исполнения и управление изменениями; решение о приёмке товара; отгрузка, приёмка заказчиком, «продавливание» УПД; претензии о неуплате и иск."
  rol: proekt
  pomogayut: [logist, kaznachey]
  kontur: "4"
  listy: ["7 Исполнение"]
  shagi: ["регламент, Планирование 0", "регламент, Поступление 1, 24", "регламент, Отгрузка 9–14", "регламент, Несоответствия 21–29", "регламент, Контроль заказчиком 30, 36, 37"]
  pochemu: "Контур 4; менеджер здесь владелец процесса и принимает решения, делают логист и другие."
  dogadka: "Крупная группа — когда дойдём до контура 4, разбить."
  status: проверить

# --- Контур 1: расчёт ---

tab-sozdanie:
  title: "Создание таблицы проекта и запуск триггеров"
  polno: "Создать копию чистой таблицы, связать её со смарт-процессом, авторизовать скрипты и один раз запустить триггеры."
  rol: tablitsy
  kontur: "1"
  shagi: ["смарт-процесс, стадия «Создать таблицу рассылки»", "3.1.2, задача «Подготовка рабочей таблицы»"]
  pochemu: "С неё начинается работа с таблицей; от того, кто её создал, зависит владелец таблицы и триггеры."
  dogadka: "В 3.1.2 основной пользователь этой задачи — общий аккаунт таблиц (spreadsheet@…), а не сотрудник. Тогда «владелец таблицы» для триггеров — этот аккаунт."
  status: проверить

tab-rassylka:
  title: "Рассылка запросов поставщикам"
  polno: "Разбить товары на группы, добавить файлы и ключевые фразы, найти адреса поставщиков, разослать письма; добрать адреса, если цен нет или их меньше трёх."
  rol: tablitsy
  soglasuyut: [tekh]
  kontur: "1"
  listy: ["1-2 Запросы по товарным группам", "1-2 Запросы КП повторная рассылка", "1-2 Запросы КП третья рассылка"]
  shagi: ["смарт-процесс, стадии «Разослать письма», «Есть товары у которых меньше 3х цен»", "3.1.2, задача «Группировка товаров, подготовка запросов, рассылка писем»"]
  pochemu: "Директор: листы группы 1 — эта роль; в смарт-процессе задачи рассылки у неё."
  dogadka: "В 3.1.2 основным пользователем указан «Ответственный за расчёт и тех. часть»."
  status: проверить

tab-otvety:
  title: "Занесение ответов поставщиков"
  polno: "Переносить цены, сроки и условия из писем поставщиков на лист 1-1; вопросы и проблемы — на листы 2-1, 2-2."
  rol: tablitsy
  kontur: "1"
  listy: ["1-1 Сбор КП", "2-1 Вопросы от Поставщиков", "2-2 Проблемы по проекту"]
  shagi: ["3.1.2, задача «Занесение ответов поставщиков»", "смарт-процесс: «собирает первичные ИЦИ»"]
  pochemu: "Отдельная задача в 3.1.2; директор: листы групп 1 и 2."
  dogadka: "Вопросы и проблемы (2-1, 2-2) по 3.1.3 разбирает ТС — возможно, это группа ТС."
  status: проверить

tekh-adresa:
  title: "Согласование адресов и добор цен"
  polno: "Согласовать список адресов для рассылки, получить дополнительные цены, помочь, если к сроку мало ответов."
  rol: tekh
  pomogayut: [tablitsy]
  kontur: "1"
  shagi: ["смарт-процесс, стадии «Согласовать запросы», «Есть товары у которых нет цен»"]
  pochemu: "В смарт-процессе это задачи «Ответственного за расчёт и тех. часть» — по ответу директора это ТС."
  status: проверить

tekh-ekspertiza:
  title: "Техническая экспертиза предложений"
  polno: "На листе 3-2 проверить название и изготовителя, написать комментарий, выбрать решение: основной, резерв, уточнить, условно соответствует, нет."
  rol: tekh
  kontur: "1"
  listy: ["3-2 Экспертиза предложений"]
  shagi: ["смарт-процесс, стадия «Тех экспертиза проекта»", "лист 3-2: «Эксперт должен»", "3.1.3: вопросы и проблемы"]
  pochemu: "Главная работа эксперта в расчёте; у листа 3-2 своя инструкция."
  status: проверить

tekh-tp:
  title: "Техническое предложение"
  polno: "Техническая часть листа 4-3 и файлы технического предложения для заявки."
  rol: tekh
  pomogayut: [proekt]
  kontur: "1"
  listy: ["4-3 Подготовка ТКП"]
  shagi: ["смарт-процесс, стадия «Подготовка ТП»", "3.1.6: «ТС отвечает за техническую часть»"]
  pochemu: "Отдельная стадия смарт-процесса; на листе 4-3 часть ТС отделена от части менеджера."
  dogadka: "Итоговый файл листа 4-3 уходит «специалисту по подготовке заявки» — директор: это кто-то из контура 0, роль пока не заведена."
  status: проверить

# --- Контур 2: закупка ---

zak-start:
  title: "Приём задачи на закупку"
  polno: "Принять задачу «Закупить», создать папку «Закупки» с подпапками «Счета», «Договоры», «В оплату»."
  rol: zakupka
  kontur: "2"
  shagi: ["регламент, Закупка 0–2"]
  pochemu: "Подготовка перед работой с поставщиками; в регламенте шаги без участия других ролей."
  status: проверить

zak-vybor:
  title: "Повторная рассылка и выбор поставщика"
  polno: "Повторная рассылка, сбор предложений, торг по цене, срокам и условиям; предложение по окончательному выбору поставщика."
  rol: zakupka
  uznayut: [proekt]
  kontur: "2"
  listy: ["5-1 Сбор КП Закупки", "5-2 Запросы КП Закупки", "5-3 Выбор поставщиков Закупки"]
  shagi: ["регламент, Закупка 3, 6"]
  pochemu: "Работа с предложениями до сделки — по листам 5-1…5-3."
  dogadka: "В регламенте шаги помечены «будет пересмотрен под изменение таблицы в части закупок» — сверить с листами 5-x."
  status: проверить

zak-kontragent:
  title: "Проверка контрагента"
  polno: "Проверить выбранных поставщиков на добросовестность до сделки."
  rol: zakupka
  pomogayut: [kaznachey]
  kontur: "2"
  shagi: ["регламент, Закупка 7", "роли.docx: Закупщик «проверяет контрагента», Казначей «делает финальную проверку контрагента»"]
  pochemu: "В роли.docx проверка есть у двух ролей: первая — у закупщика, финальная — у казначея."
  dogadka: "Регламент: «требуется найти хороший сервис проверки»."
  status: проверить

zak-oformlenie:
  title: "Оформление сделки: счета и договоры"
  polno: "Подготовить договор (свыше 100 000 руб.), получить подписанные договоры или счета по нашим требованиям, вести лист закупки, положить согласованное в «В оплату», поставить задачу на оплату."
  rol: zakupka
  pomogayut: [kaznachey]
  uznayut: [proekt]
  kontur: "2"
  listy: ["5-5 Оформление сделок"]
  shagi: ["регламент, Закупка 11–13, 16–18"]
  pochemu: "Главная работа закупщика по роли.docx: «оформляет счёт или договор». Лист закупки в регламенте — «5 Закупка товара Внешняя», в будущем — листы 5-x."
  status: проверить

zak-tekh-soglasovanie:
  title: "Технические согласования в закупке"
  polno: "Рассмотреть предложения поставщиков в технической части, согласовать счета, договоры, ТЗ, изготовителя и состав документации."
  rol: tekh
  pomogayut: [zakupka]
  soglasuyut: [proekt, vladelets]
  kontur: "2"
  shagi: ["регламент, Закупка 8, 9, 14, 15", "роли.docx: ТС «согласует техническую часть»"]
  pochemu: "Закупщик ставит задачи (8, 14), решение по технике — за ТС. Выделено в группу ТС, чтобы инструкция ТС знала свои шаги в закупке."
  dogadka: "В регламенте исполнитель шага 15 — закупщик, а ТС, менеджер и владелец согласуют. Здесь группа записана на ТС — проверить."
  status: проверить

zak-soglasovanie-sdelki:
  title: "Согласование сделки и финансирования"
  polno: "Поставить задачу «Закупить» и согласовать сделку, в том числе наличие финансирования."
  rol: vladelets
  kontur: "2"
  shagi: ["роли.docx: Владелец процесса закупок", "регламент, Закупка 15 (согласование)"]
  pochemu: "Единственное, что о роли сказано в роли.docx."
  dogadka: "Задачу на закупку в регламенте ставит менеджер (Передача в закупки 5), а не владелец — расхождение."
  status: проверить

zak-zakrytie:
  title: "Закрытие этапа закупки"
  polno: "Когда по всем счетам есть платёжные поручения — закрыть этап закупки и задачи в Битрикс24."
  rol: zakupka
  pomogayut: [proekt]
  kontur: "2"
  shagi: ["регламент, Закупка 25"]
  pochemu: "Отдельный шаг выхода из процесса; статус проекта меняет менеджер (комментарий в регламенте)."
  status: проверить

zak-postavka:
  title: "Сопровождение поставки"
  polno: "Отправить поставщикам подписанные договоры, определить плановые сроки, эскалировать задержки, готовить претензии, проверить готовность к отгрузке, собрать технические документы, мотивированный отказ."
  rol: zakupka
  pomogayut: [kaznachey, logist]
  soglasuyut: [tekh, proekt]
  kontur: "4"
  shagi: ["регламент, Поступление 4, 5, 7, 9–12, 20, 25"]
  pochemu: "Закупщик продолжает работу в исполнении. Выделено отдельно: в регламенте пометка «подумать как оптимизировать, это из закупок» — группу, возможно, передадут логисту."
  status: проверить

# --- Контур 3: оплаты и договоры ---

kazn-proverka:
  title: "Проверка счетов, 1С и таблица оплат"
  polno: "Проверить счета и договоры перед оплатой, создать заказы в 1С, передать счета на оплату, разложить оплаченное по папкам, внести оплаты и доплаты в таблицу оплат."
  rol: kaznachey
  kontur: "3"
  listy: ["6 Оплаты", "таблица оплат"]
  shagi: ["регламент, Закупка 19–21, 23, 24", "регламент, Поступление 14, 16", "роли.docx: Казначей «проверяет счёт или договор перед оплатой»"]
  pochemu: "В регламенте это один исполнитель (столбец K), и все шаги — до и после оплаты."
  dogadka: "Возможно, это отдельная роль (бухгалтер, координатор), а не Казначей: тот же исполнитель ведёт учёт в 1С и регистрацию входящих (группа kazn-uchet)."
  status: проверить

kazn-oplata:
  title: "Оплата и подписание"
  polno: "Оплатить счета и доплаты, вернуть платёжные поручения; подписать договор с заказчиком через ЭДО."
  rol: kaznachey
  kontur: "3"
  shagi: ["регламент, Закупка 22", "регламент, Поступление 15", "регламент, Контрактация 15, 17", "роли.docx: Казначей «оплачивает»"]
  pochemu: "В регламенте эти шаги у другого исполнителя (столбец M), чем проверка — разделено на две группы."
  dogadka: "Столбец M подписывает договоры и отправляет оригиналы «с привлечением логиста или директора» — похоже на руководство с правом подписи и банка, а не на Казначея."
  status: проверить

kazn-uchet:
  title: "Учёт: 1С, документы, оплаты заказчика"
  polno: "Оприходовать товары в 1С, изготовить отгрузочные документы, регистрировать входящие о несоответствии, следить за оплатами заказчика, писать претензии о неуплате."
  rol: kaznachey
  pomogayut: [proekt]
  kontur: "3–4"
  shagi: ["регламент, Поступление 27", "регламент, Подготовка к отгрузке 3", "регламент, Несоответствия 18–20", "регламент, Контроль заказчиком 31–34"]
  pochemu: "Тот же исполнитель, что в kazn-proverka (столбец K), но не про оплату поставщикам. Выделено, чтобы легко было перенести в отдельную роль."
  dogadka: "Похоже на роль «Бухгалтер / Координатор» — в роли.docx такой нет."
  status: проверить

# --- Контур 4: исполнение (логистика) ---

log-postavka:
  title: "Контроль поставки"
  polno: "Найти оплаченные товары без статуса, подтвердить у поставщиков получение денег и сроки, следить за сроками поставки, сообщить о доплате."
  rol: logist
  pomogayut: [zakupka]
  kontur: "4"
  shagi: ["регламент, Поступление 2, 3, 5, 6, 13"]
  pochemu: "Шаги до доставки, все у логиста (АС); плановые сроки — вместе с закупщиком."
  status: проверить

log-dostavka:
  title: "Доставка"
  polno: "Выбрать способ доставки и исполнителя, организовать доставку и расчёты с перевозчиком, собрать транспортные документы и отчёт по расходам."
  rol: logist
  soglasuyut: [zakupka, proekt]
  uznayut: [kaznachey]
  kontur: "4"
  shagi: ["регламент, Поступление 17–19", "роли.docx: Логист «решает, как доставлять»"]
  pochemu: "Ровно то, что о логисте сказано в роли.docx."
  status: проверить

