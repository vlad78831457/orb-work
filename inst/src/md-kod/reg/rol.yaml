# Должности: кто по факту выполняет обязанности. Упоминание в тексте: [[rol.zakupka]].
# Что делается — в обязанностях (reg/oby.yaml): «тот, кто …», одна обязанность — один ответственный.
# У обязанности поле predpolagaem — какая должность, по нашей догадке, её выполняет. Переназначить = поменять его.
#
# Поля: title, polno — карточка; kontur — где в основном работает; nazvaniya — как ещё называют в текстах;
# kolonka — столбец регламента «Распределение задач» (H…N): по нему сборщик сверяет регламент с нашими догадками;
# istochnik — откуда взято; pochemu — почему это отдельная должность; dogadka — что не подтверждено.
# Имён сотрудников здесь нет; столбцы K и M в регламенте подписаны именами — здесь только буквы.
#
# Источники (самые точные, директор 2026-10-19):
#   регламент — raw/2026-10-19-ak-xls/Копия Распределение задач Контрактация - Исполнение.xlsx (→ pro/*/reglament.yaml);
#   роли.docx — raw/2026-10-19-ak-xls/роли.docx, согласовано;
#   смарт-процесс — raw/2026-10-19-aj-md/Инструкция Смарт процесса Расчет.md;
#   3.1.2, лист 3-2 — raw/2026-10-19-aj-md/;
#   ответы — inst/rol_chek.md, раунды 1 и 2.

prodazhi:
  title: "Менеджер по продажам"
  polno: "До договора: ведёт папку проекта и заявку, заключает договор с заказчиком (контрактация)."
  kontur: "0"
  kolonka: [H]
  nazvaniya: ["Менеджер (регламент, Контрактация)", "РОП — упомянут один раз через «или»"]
  istochnik: [регламент, ответы]
  pochemu: "Директор (раунд 2, №5): две должности — менеджер по продажам до договора и менеджер проекта после. В «Структуре папок» папки проекта создаёт и наполняет «Менеджер по продажам»."
  dogadka: "В регламенте оба менеджера — один столбец H, поэтому сверка с регламентом их не различает."
  status: проверить

proekt:
  title: "Менеджер проекта"
  polno: "Согласует сделку и отклонения от задания. В отсутствие Технического эксперта согласует название товара."
  kontur: "0 — управление; ведёт проект после договора через все контуры"
  kolonka: [H]
  nazvaniya: ["Ответственный за сделку Менеджер (смарт-процесс)", "Руководитель проекта", "Менеджер (регламент)"]
  istochnik: [роли.docx, регламент, смарт-процесс, ответы]
  pochemu: "Во всех источниках есть человек, который принимает решения по проекту; в регламенте у столбца H больше всего шагов."
  status: готово

vladelets:
  title: "Владелец процесса (руководитель исполнителя)"
  polno: "Ставит задачу «Закупить». Согласует сделку, в том числе наличие финансирования; назначает ответственных за экспорт и судебную работу."
  kontur: "0"
  kolonka: [N]
  nazvaniya: ["Владелец процесса закупок (роли.docx)", "Руководитель исполнителя (смарт-процесс)"]
  istochnik: [роли.docx, регламент, смарт-процесс, ответы]
  pochemu: "Директор (раунд 2, №6): руководитель исполнителя и владелец процесса — один человек."
  status: проверить

koordinator:
  title: "Координатор"
  polno: "Контур 0: ставит и принимает задачи этапов (например, задачу на заключение договора)."
  kontur: "0"
  istochnik: [регламент, ответы]
  pochemu: "В регламенте «принять задачу у Координатора» (Контрактация 20) и «передача на регистрацию Координатору» (Несоответствия 17). Директор (раунд 2, №7): это не столбец K, а кто-то из контура 0."
  dogadka: "Столбца в регламенте нет; что ещё делает — не сказано."
  status: проверить

zayavka:
  title: "Специалист по подготовке заявки"
  polno: "Контур 0: получает итоговый файл листа 4-3 и готовит по нему заявку на процедуру."
  kontur: "0"
  istochnik: [3.1.6, ответы]
  pochemu: "Директор (раунд 2, №9): заводить."
  status: проверить

tablitsy:
  title: "Ответственный за создание таблиц и сбор ИЦИ"
  polno: "Создаёт таблицу проекта и запускает триггеры, находит поставщиков и рассылает запросы, по ответам заполняет список предложений — листы групп 1 и 2."
  kontur: "1 — расчёт, листы 1-x и 2-x"
  nazvaniya: ["Специалист по выполнению расчёта (3.1.3)"]
  istochnik: [смарт-процесс, 3.1.2, ответы]
  pochemu: "Директор (раунд 2, №11): в контуре 1 работают в паре с экспертом — один находит поставщиков и шлёт письма, по ответам заполняет предложения; эксперт проверяет поставщиков и предложения."
  status: проверить

tekh:
  title: "Технический эксперт (ТС)"
  polno: "Согласует техническую часть: ТЗ, договор, спецификацию, Изготовителя, состав документации. Проверяет документы и фотоотчёт к уведомлению о готовности. Согласует отклонение названия товара от задания."
  kontur: "1 — расчёт, листы 3-x и 4-x; в закупке и приёмке — согласует"
  kolonka: [I]
  nazvaniya: ["Ответственный за расчёт и тех. часть (смарт-процесс)", "Технический специалист", "Специалист по подбору оборудования", "Инженер", "Эксперт", "Специалист по расчёту (3.1.2)"]
  istochnik: [роли.docx, регламент, смарт-процесс, лист 3-2, ответы]
  pochemu: "Директор (раунд 1): ТС, инженер и специалист по подбору оборудования — одна роль; «специалист по расчёту» ближе к эксперту, листы групп 3 и 4."
  status: готово

zakupka:
  title: "Закупщик (специалист по закупке)"
  polno: "Ведёт задачу «Закупить»: ищет Поставщика, проверяет контрагента, оформляет счёт или договор, проверяет их на соответствие заданию и регламенту."
  kontur: "2 — закупка, листы 5-x; часть шагов в исполнении"
  kolonka: [J]
  nazvaniya: ["Специалист по снабжению (Закупщик)", "Снабженец", "Ответственный по закупке"]
  istochnik: [роли.docx, регламент, ответы]
  pochemu: "В регламенте — владелец процесса «Закупка товара»."
  dogadka: "Директор (раунд 2, №8): в конце закупки сотрудник контура 2 принимает задачу по оплате у K, а логист принимает задачу по закупке у него — значит, сотрудник контура 2 — закупщик."
  status: готово

khranitel:
  title: "Хранитель учёта и документов (столбец K)"
  polno: "Проверяет счета перед оплатой, ведёт 1С, папки оплат и таблицу оплат, регистрирует входящие, готовит отгрузочные документы, следит за оплатами заказчика."
  kontur: "3 — оплаты и договоры"
  kolonka: [K]
  istochnik: [регламент, ответы]
  pochemu: "Директор (раунд 2, №4): у этого сотрудника много обязанностей, «он хранитель там всего»; в регламенте его работа сведена в один столбец."
  dogadka: "Это одна должность или несколько мелких (бухгалтер, делопроизводитель, учёт в 1С) — проверить по обязанностям."
  status: проверить

podpisant:
  title: "Подписант и плательщик (столбец M)"
  polno: "Оплачивает счета и доплаты, подписывает договор с заказчиком через ЭДО."
  kontur: "3"
  kolonka: [M]
  istochnik: [регламент, ответы]
  pochemu: "В регламенте отдельный столбец; его шаги — только оплата и подпись."
  dogadka: "Директор (раунд 2, №4): столбец M сейчас — «тот, кто заполняет 5-3, 5-5 и следит за ходом выбранного». С регламентом это расходится — проверить."
  status: проверить

kaznachey:
  title: "Казначей"
  polno: "Проверяет счёт или договор перед оплатой, делает финальную проверку контрагента, оплачивает."
  kontur: "3 — оплаты и договоры"
  istochnik: [роли.docx]
  pochemu: "Должность из роли.docx."
  dogadka: "В регламенте его обязанности делят столбцы K (проверка) и M (оплата); своего столбца нет."
  status: готово

logist:
  title: "Логист"
  polno: "Решает, как доставлять: «Деловые линии», другая транспортная компания или самовывоз, если это дешевле."
  kontur: "4 — исполнение"
  kolonka: [L]
  nazvaniya: ["АС (регламент)"]
  istochnik: [роли.docx, регламент, ответы]
  pochemu: "Директор: столбец «АС» в регламенте — это логист."
  status: готово
