# Роли: должности, кто работает в таблицах. Упоминание в тексте: [[rol.zakupka]].
# Что именно делает роль — в группах задач (reg/zad.yaml): у каждой группы поле rol.
# Перегруппировать работу = поменять rol у группы; роли при этом не трогаем.
#
# Поля: title, polno — карточка; kontur — где роль в основном работает; nazvaniya — как её ещё зовут в текстах;
# stolbets — столбец в регламенте «Распределение задач» (лист «10.10.2026 Версия К»);
# istochnik — откуда взято; pochemu — почему это отдельная роль; dogadka — что не подтверждено.
# Имён сотрудников здесь нет — только роли.
#
# Источники (самые точные, директор 2026-10-19):
#   роли.docx — raw/2026-10-19-ak-xls/роли.docx, согласовано;
#   регламент — raw/2026-10-19-ak-xls/Копия Распределение задач Контрактация - Исполнение.xlsx;
#   смарт-процесс — raw/2026-10-19-aj-md/Инструкция Смарт процесса Расчет.md;
#   3.1.2 — raw/2026-10-19-aj-md/3.1.2 Инструкция по работе с таблицами для специалиста по расчету.md;
#   лист 3-2 — raw/2026-10-19-aj-md/Инструкция по работе с листом 3-2.md;
#   ответы — inst/rol_chek.md, ответы директора 2026-10-19.

proekt:
  title: "Менеджер проекта"
  polno: "Согласует сделку и отклонения от задания. В отсутствие Технического эксперта согласует название товара."
  kontur: "0 — управление; ведёт проект через все контуры"
  nazvaniya: ["Ответственный за сделку Менеджер (смарт-процесс)", "Руководитель проекта", "Менеджер (регламент)"]
  stolbets: "H «Менеджер»"
  istochnik: [роли.docx, регламент, смарт-процесс, ответы]
  pochemu: "Во всех источниках есть человек, который принимает решения по проекту и общается с заказчиком; в регламенте у него больше всего шагов."
  dogadka: "В регламенте столбец «Менеджер» объединяет и работу с заказчиком до договора (Контрактация), и ведение проекта. В структуре папок отдельно назван «Менеджер по продажам», в Передаче в закупки — «Менеджер по продажам или РОП». Возможно, это две роли."
  status: готово

rukovoditel:
  title: "Руководитель исполнителя"
  polno: "Контур 0, рядом с менеджером проекта: видит сделки и паспорт расчёта, своих задач в источниках нет."
  kontur: "0"
  istochnik: [смарт-процесс, ответы]
  pochemu: "В смарт-процессе назван среди основных пользователей сделок и стадии «Заполнить паспорт проекта»."
  dogadka: "Что делает — не сказано. Может быть тем же, кто в регламенте назван «Владелец процесса» (столбец N): назначает ответственных за экспорт и судебную работу."
  status: проверить

tablitsy:
  title: "Ответственный за создание таблиц и сбор ИЦИ"
  polno: "Создаёт таблицу проекта, запускает триггеры, ведёт список рассылки, рассылает запросы и собирает первичные ИЦИ от поставщиков — листы групп 1 и 2."
  kontur: "1 — расчёт, листы 1-x и 2-x"
  nazvaniya: ["Специалист по выполнению расчёта (3.1.3)"]
  istochnik: [смарт-процесс, ответы]
  pochemu: "В смарт-процессе — отдельная роль со своими задачами; директор: это листы групп 1 и 2."
  dogadka: "В 3.1.2 основным пользователем рассылки и занесения ответов указан «Ответственный за расчёт и тех. часть», а не эта роль — расхождение источников."
  status: проверить

tekh:
  title: "Технический эксперт (ТС)"
  polno: "Согласует техническую часть: ТЗ, договор, спецификацию, Изготовителя, состав документации. Проверяет документы и фотоотчёт к уведомлению о готовности. Согласует отклонение названия товара от задания."
  kontur: "1 — расчёт, листы 3-x и 4-x; в закупке и приёмке — согласует"
  nazvaniya: ["Ответственный за расчёт и тех. часть (смарт-процесс)", "Технический специалист", "Специалист по подбору оборудования", "Инженер", "Эксперт", "Специалист по расчёту (3.1.2)"]
  stolbets: "I «ТС (эксперт)»"
  istochnik: [роли.docx, регламент, смарт-процесс, лист 3-2, ответы]
  pochemu: "Директор: ТС, инженер и специалист по подбору оборудования — одна роль; «специалист по расчёту» ближе к эксперту, листы групп 3 и 4."
  dogadka: "Объединена с ролью первого контура «Ответственный за расчёт и тех. часть» по ответу директора — проверить, что это действительно один человек."
  status: готово

zakupka:
  title: "Закупщик (специалист по закупке)"
  polno: "Ведёт задачу «Закупить»: ищет Поставщика, проверяет контрагента, оформляет счёт или договор, проверяет их на соответствие заданию и регламенту."
  kontur: "2 — закупка, листы 5-x; часть шагов в исполнении"
  nazvaniya: ["Специалист по снабжению (Закупщик)", "Снабженец", "Ответственный по закупке"]
  stolbets: "J «Закупщик»"
  istochnik: [роли.docx, регламент, ответы]
  pochemu: "В регламенте — владелец процесса «Закупка товара»; директор: закупку второго контура ведёт эта роль."
  status: готово

vladelets:
  title: "Владелец процесса закупок"
  polno: "Ставит задачу «Закупить». Согласует сделку, в том числе наличие финансирования."
  stolbets: "N «Владелец процесса»"
  istochnik: [роли.docx, регламент]
  pochemu: "Отдельная роль в роли.docx и отдельный столбец в регламенте."
  dogadka: "В регламенте у столбца N шаги не только в закупке: назначает ответственного за экспорт и планирует судебную работу. Похоже на руководителя, а не только на закупки."
  status: готово

kaznachey:
  title: "Казначей"
  polno: "Проверяет счёт или договор перед оплатой, делает финальную проверку контрагента, оплачивает."
  kontur: "3 — оплаты и договоры"
  stolbets: "K (сотрудник) и M (руководство) — см. dogadka"
  istochnik: [роли.docx, регламент, ответы]
  pochemu: "Отдельная роль в роли.docx."
  dogadka: "В регламенте работу Казначея делят два столбца. K: проверяет счета, ведёт 1С, папки оплат и таблицу оплат, регистрирует входящие (в регламенте он же «Координатор»). M: оплачивает и подписывает договоры через ЭДО — похоже на руководство с правом подписи. Пока обе части записаны сюда, разведены по группам задач."
  status: готово

logist:
  title: "Логист"
  polno: "Решает, как доставлять: «Деловые линии», другая транспортная компания или самовывоз, если это дешевле."
  kontur: "4 — исполнение"
  nazvaniya: ["АС (регламент)"]
  stolbets: "L «АС»"
  istochnik: [роли.docx, регламент, ответы]
  pochemu: "Отдельная роль в роли.docx; директор: столбец «АС» в регламенте — это логист."
  status: готово
