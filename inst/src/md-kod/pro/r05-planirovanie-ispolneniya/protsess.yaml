# Толкование шагов регламента (reglament.yaml рядом — как записано). Руками.
# Шаг: delaet — обязанность-исполнитель (ровно одна, reg/oby.yaml); stavit — кто ставит задачу; prinimaet — кто принимает
# результат; otslezhivaet, soglasuyut — обязанности (списки); pomogayut, uznayut — должности «rol.ключ» (списки).
# mesto — места работы (reg/mes.yaml); status — {объект: новый статус}; dogadka — что не подтверждено.
kontur: "4"
dalee: [r06-postuplenie]
shagi:
  pl-0: {delaet: plan-ispolneniya, uznayut: [rol.tekh, rol.zakupka, rol.khranitel, rol.logist, rol.podpisant, rol.vladelets]}
  pl-0b: {delaet: upravlenie-izmeneniyami, uznayut: [rol.tekh, rol.zakupka, rol.khranitel, rol.logist, rol.podpisant, rol.vladelets]}
  pl-x1: {delaet: otchetnost}
