# Столбцы листа «3-3 Выбор поставщиков»: что это (chto) и как заполняется (kak). Руками.
# id — служебное имя столбца (строка 2) или буква; id со * или ? — шаблон: одно описание на повторяющийся блок
# (сравнивается со служебным именем и заголовком). bukva и zagolovok — для ориентира, сборщик берёт их из struktura.yaml.
# Черновик 2026-10-20 по формулам, заголовкам и старым инструкциям 3.1.2–3.1.8; «(догадка)» — не подтверждено,
# «⚠» — похоже на ошибку в таблице, проверить.
- id: A
  bukva: A
  zagolovok: №
  chto: № позиции
  kak: 'формула: с листа 1-1'
- id: B
  bukva: B
  zagolovok: Номенклатура
  chto: номенклатура; по формуле этой ячейки лист находит строку товара на 1-1 (столбец DA)
  kak: 'формула: с листа 1-1'
- id: C
  bukva: C
  zagolovok: Ед
  chto: единица измерения
  kak: 'формула: с листа 1-1'
- id: D
  bukva: D
  zagolovok: Кол
  chto: количество
  kak: 'формула: с листа 1-1'
- id: E
  bukva: E
  zagolovok: Цена
  chto: цена выбранного поставщика (столбец K) по листу 1-1
  kak: 'формула: через служебные столбцы CT–CW'
- id: F
  bukva: F
  zagolovok: Сумма
  chto: количество × цена
  kak: формула
- id: G
  bukva: G
  zagolovok: Группа
  chto: группа рассылки
  kak: 'формула: с листа 1-1'
- id: H
  bukva: H
  zagolovok: Срок поставки
  chto: срок поставки у выбранного поставщика
  kak: 'формула: с листа 1-1, из блока выбранного поставщика'
- id: I
  bukva: I
  zagolovok: Срок поставки по договору
  chto: срок поставки по договору
  kak: 'формула: с листа 1-1'
- id: J
  bukva: J
  zagolovok: Нац режим 1875
  chto: нац. режим 1875
  kak: 'формула: с листа 1-1'
- id: K
  bukva: K
  zagolovok: Поставщик
  chto: выбранный поставщик — самый дешёвый из подходящих под ТЗ (e-mail)
  kak: руками (3.1.4, 3.1.7); каждый просмотренный — комментарий
- id: L
  bukva: L
  zagolovok: Резервный поставщик
  chto: резервный поставщик; над столбцом — сколько разных поставщиков выбрано
  kak: руками; счётчик — формула
- id: M
  bukva: M
  zagolovok: ''
  chto: у скольких товаров выбранный поставщик — первый по цене (догадка, 3.1.4 п. 10)
  kak: формула
- id: N
  bukva: N
  zagolovok: НМЦ
  chto: НМЦ за единицу
  kak: 'формула: с листа 1-1'
- id: O
  bukva: O
  zagolovok: Статус
  chto: статус товара, например «Отдал в оплату» (3.1.7)
  kak: руками
- id: P
  bukva: P
  zagolovok: Предполагаемая дата оплаты
  chto: предполагаемая дата оплаты
  kak: руками (догадка)
- id: Q
  bukva: Q
  zagolovok: Комментарий
  chto: комментарий по выбору — коротко и понятно другому человеку (3.1.4)
  kak: руками
- id: R
  bukva: R
  zagolovok: Разница от миним
  chto: насколько цена выбранного выше минимальной («1 цена»)
  kak: формула
- id: S
  bukva: S
  zagolovok: Итого разница
  chto: то же на всё количество
  kak: формула
- id: T
  bukva: T
  zagolovok: Название товара в ТП
  chto: название и изготовитель из предложения выбранного поставщика — для технического предложения
  kak: 'формула: с листа 1-1'
- id: Y
  bukva: Y
  zagolovok: 'Всего: 0 вопросов

    Всего: 0 проблем'
  chto: вопросы и проблемы по товару (с листов 3-2 и 2-1, догадка); в заголовке — итог по проекту
  kak: формула
- id: Z
  bukva: Z
  zagolovok: БлокТопНачало
  chto: начало блока топ-7
  kak: 'не трогать: по метке формулы и скрипты находят начало или конец блока'
- id: '* Формула'
  bukva: AA…CQ (35)
  zagolovok: 1 Формула
  chto: 'скрытые служебные: значение из списка «Лучшие цены» листа 1-1 (адрес ячейки или текст); видимое — в соседнем столбце'
  kak: формула; не трогать
- id: '? цена'
  bukva: AB…CJ (7)
  zagolovok: 1 цена
  chto: 'место 1–7 по цене: цена'
  kak: формула (из «Лучших цен» листа 1-1)
- id: '? Поставщик'
  bukva: AD…CL (7)
  zagolovok: 1 Поставщик
  chto: поставщик этого места (e-mail)
  kak: формула
- id: '? Комментарий'
  bukva: AF…CN (7)
  zagolovok: 1 Комментарий
  chto: комментарий к предложению
  kak: формула
- id: '? срок'
  bukva: AH…CP (7)
  zagolovok: 1 срок
  chto: срок поставки
  kak: формула
- id: '? Эксперт'
  bukva: AJ…CR (7)
  zagolovok: 1 Эксперт
  chto: оценка эксперта (лист 3-2, догадка)
  kak: формула
- id: CS
  bukva: CS
  zagolovok: БлокТопКонец
  chto: конец блока топ-7
  kak: 'не трогать: по метке формулы и скрипты находят начало или конец блока'
- id: CT
  bukva: CT
  zagolovok: НЕТ
  chto: служебный (в заголовке — ячейка K11 листа «Настройки писем»); смысл — проверить
  kak: формула
- id: CU
  bukva: CU
  zagolovok: ''
  chto: 'служебный: цена по номеру столбца из CT'
  kak: формула
- id: CV
  bukva: CV
  zagolovok: ''
  chto: 'служебный: в каком столбце листа 1-1 блок выбранного поставщика (K)'
  kak: формула
- id: CW
  bukva: CW
  zagolovok: ''
  chto: 'служебный: цена выбранного поставщика'
  kak: формула
- id: CX
  bukva: CX
  zagolovok: ''
  chto: сколько вопросов по товару без ответа (лист 2-1)
  kak: формула
- id: CY
  bukva: CY
  zagolovok: ''
  chto: 'служебный: номенклатура из строки товара на 1-1'
  kak: формула
- id: CZ
  bukva: CZ
  zagolovok: ''
  chto: 'служебный: «Лучшие цены» из строки товара на 1-1 (столбец IE)'
  kak: формула
- id: DA
  bukva: DA
  zagolovok: Лист1 Номер строки
  chto: номер строки товара на листе 1-1 — из текста формулы столбца B
  kak: формула
- id: DB
  bukva: DB
  zagolovok: ТопЭксперта
  chto: топ с учётом эксперта (догадка)
  kak: в чистой таблице пусто — проверить
