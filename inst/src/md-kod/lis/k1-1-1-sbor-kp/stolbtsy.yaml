# Столбцы листа «1-1 Сбор КП»: что это (chto) и как заполняется (kak). Руками.
# id — служебное имя столбца (строка 2) или буква; id со * или ? — шаблон: одно описание на повторяющийся блок
# (сравнивается со служебным именем и заголовком). bukva и zagolovok — для ориентира, сборщик берёт их из struktura.yaml.
# Черновик 2026-10-20 по формулам, заголовкам и старым инструкциям 3.1.2–3.1.8; «(догадка)» — не подтверждено,
# «⚠» — похоже на ошибку в таблице, проверить.
- id: B
  bukva: B
  zagolovok: ''
  chto: 'служебная ячейка: значение с листа 4-1 (ячейка AJ43); смысл неизвестен'
  kak: формула
- id: C
  bukva: C
  zagolovok: №
  chto: № позиции по спецификации тендера
  kak: руками, только значения (Ctrl+Shift+V) из файлов тендера (3.1.2)
- id: D
  bukva: D
  zagolovok: Номенклатура
  chto: название товара; если договор требует изготовителя — дописать «Обязательно …» (3.1.7)
  kak: руками, только значения (Ctrl+Shift+V) из файлов тендера (3.1.2)
- id: E
  bukva: E
  zagolovok: Характеристики
  chto: характеристики товара
  kak: руками, только значения (Ctrl+Shift+V) из файлов тендера (3.1.2)
- id: F
  bukva: F
  zagolovok: Ед. Изм
  chto: единица измерения
  kak: руками, только значения (Ctrl+Shift+V) из файлов тендера (3.1.2)
- id: G
  bukva: G
  zagolovok: Кол-во
  chto: количество — число без пробелов
  kak: руками, только значения (Ctrl+Shift+V) из файлов тендера (3.1.2)
- id: H
  bukva: H
  zagolovok: Цена
  chto: 'цена за единицу для расчёта (догадка: выбранная или лучшая цена)'
  kak: в чистой таблице пусто — проверить
- id: I
  bukva: I
  zagolovok: Итого
  chto: 'итого: количество × цена (догадка)'
  kak: в чистой таблице пусто — проверить
- id: J
  bukva: J
  zagolovok: Предложений
  chto: сколько предложений пришло по товару (догадка)
  kak: в чистой таблице пусто — проверить
- id: K
  bukva: K
  zagolovok: НМЦ
  chto: НМЦ за единицу из тендера; над столбцом — итог «кол-во × НМЦ», его сверяют с НМЦ договора на листе 0-Паспорт проекта
  kak: руками, только значения (Ctrl+Shift+V) из файлов тендера (3.1.2), числа без пробелов; итог — формула
- id: L
  bukva: L
  zagolovok: Нац режим 1875
  chto: национальный режим по постановлению № 1875 (догадка по названию)
  kak: руками, из списка (Настройки писем, столбец AO)
- id: M
  bukva: M
  zagolovok: Код ОКПД 2
  chto: код ОКПД 2
  kak: руками, только значения (Ctrl+Shift+V) из файлов тендера (3.1.2)
- id: N
  bukva: N
  zagolovok: Срок поставки по договору
  chto: срок поставки, который требует заказчик
  kak: руками (догадка)
- id: O
  bukva: O
  zagolovok: Группа
  chto: группа товаров рассылки — у каждого товара должна быть группа (3.1.2)
  kak: 'формула: по № с листа 1-2'
- id: P
  bukva: P
  zagolovok: Доля ответов
  chto: доля ответивших поставщиков, число предложений и писем по товару (догадка по заголовкам)
  kak: формула на три столбца P–R — по адресам групп листа 1-2
- id: Q
  bukva: Q
  zagolovok: Предложение
  chto: число предложений по товару (догадка)
  kak: формула столбца P
- id: R
  bukva: R
  zagolovok: Писем
  chto: число отправленных писем по товару (догадка)
  kak: формула столбца P
- id: свободны*
  bukva: S…Y (7)
  zagolovok: свободные
  chto: запас под новые столбцы
  kak: не заполнять
- id: Z
  bukva: Z
  zagolovok: Цены Начало
  chto: 'метка «Цены Начало»: отсюда вправо — блоки предложений'
  kak: 'не трогать: по метке формулы и скрипты находят начало или конец блока'
- id: AA
  bukva: AA
  zagolovok: ''
  chto: 'блоки предложений — по 3 столбца на поставщика, с AA вправо: в строке заголовков — e-mail поставщика; в строке товара — цена за единицу в рублях с НДС, срок поставки, название и изготовитель. Аналог — столбец цены жёлтым; если у поставщика и оригинал, и аналог — вносится дважды, к e-mail индекс «(1)»'
  kak: 'руками по письмам поставщиков (3.1.2, 3.1.3): цена без НДС — формулой ×1,2, валюта — × курс из B2–B4; итог по поставщику должен совпасть со счётом; формула в AA — итоги по столбцам цен (догадка)'
- id: HS
  bukva: HS
  zagolovok: Цены Конец
  chto: 'метка «Цены Конец»: конец блоков предложений'
  kak: 'не трогать: по метке формулы и скрипты находят начало или конец блока'
- id: HT
  bukva: HT
  zagolovok: 1 цена
  chto: 'старый «топ-3»: 1-я цена по товару (догадка: устарел, его заменил столбец IE и лист 3-3)'
  kak: формула; ⚠ ищет цены с R, а не с AA, — в поиск попадают служебные столбцы
- id: HU
  bukva: HU
  zagolovok: поставщик
  chto: поставщик 1-й цены
  kak: формула
- id: HV
  bukva: HV
  zagolovok: 2 цена
  chto: 2-я цена
  kak: формула
- id: HW
  bukva: HW
  zagolovok: поставщик
  chto: поставщик 2-й цены
  kak: формула; ⚠ сдвиг от A, а не от AA, как у соседних — может показывать не того поставщика
- id: HX
  bukva: HX
  zagolovok: 3 цена
  chto: 3-я цена
  kak: формула
- id: HY
  bukva: HY
  zagolovok: поставщик
  chto: поставщик 3-й цены
  kak: формула
- id: ID
  bukva: ID
  zagolovok: Комментарий
  chto: все комментарии к предложениям по товару одной строкой (из блока IF–IL)
  kak: формула
- id: IE
  bukva: IE
  zagolovok: Лучшие цены
  chto: 'лучшие предложения по товару: адреса ячеек с ценой, поставщиком, сроком… — их разбирает лист 3-3 (столбец CZ)'
  kak: формула
- id: IF
  bukva: IF
  zagolovok: CommentBlokStart
  chto: начало блока комментариев к предложениям (IF–IL)
  kak: 'не трогать: по метке формулы и скрипты находят начало или конец блока'
- id: IL
  bukva: IL
  zagolovok: CommentBlokEnd
  chto: конец блока комментариев к предложениям
  kak: 'не трогать: по метке формулы и скрипты находят начало или конец блока'
- id: IQ
  bukva: IQ
  zagolovok: КомментарийЭксперта
  chto: все комментарии эксперта по товару одной строкой (из блока IS–JF)
  kak: формула
- id: IR
  bukva: IR
  zagolovok: ТопЭксперта
  chto: лучшие предложения с учётом оценки эксперта (догадка)
  kak: формула
- id: IS
  bukva: IS
  zagolovok: CommentExpertBlokStart
  chto: начало блока комментариев эксперта (IS–JF)
  kak: 'не трогать: по метке формулы и скрипты находят начало или конец блока'
- id: JF
  bukva: JF
  zagolovok: CommentExpertBlokEnd
  chto: конец блока комментариев эксперта
  kak: 'не трогать: по метке формулы и скрипты находят начало или конец блока'
