# Столбцы листа «5-1 Сбор КП Закупки»: что это (chto) и как заполняется (kak). Руками.
# id — служебное имя столбца (строка 2) или буква; id со * или ? — шаблон: одно описание на повторяющийся блок
# (сравнивается со служебным именем и заголовком). bukva и zagolovok — для ориентира, сборщик берёт их из struktura.yaml.
# Черновик 2026-10-20 по формулам, заголовкам и старым инструкциям 3.1.2–3.1.8; «(догадка)» — не подтверждено,
# «⚠» — похоже на ошибку в таблице, проверить.
- id: err
  bukva: A
  zagolovok: ''
  chto: служебный блок A1:B9 — копия с листа 1-1; там курсы валют (B2 — доллар, B3 — евро, B4 — другая валюта, по 3.1.3)
  kak: 'формула: с листа 1-1, A1:B9'
- id: err2
  bukva: B
  zagolovok: ''
  chto: служебный столбец каркаса
  kak: ''
- id: C
  bukva: C
  zagolovok: ID_Товара
  chto: ID_Товара
  kak: 'формула: с листа 5-0 Товары'
- id: Номер
  bukva: D
  zagolovok: №
  chto: № позиции
  kak: 'формула: с листа 5-0 Товары'
- id: Номенклатура
  bukva: E
  zagolovok: Номенклатура
  chto: название товара
  kak: 'формула: с листа 5-0 Товары'
- id: НазваниеТовараПоДоговору
  bukva: F
  zagolovok: Название товара по договору
  chto: название товара как в договоре с заказчиком
  kak: руками; расхождение с листом 5-0 Передача подсвечивается (столбец Y «РазличиеМужду»)
- id: ИзготовительТовараПоДоговору
  bukva: G
  zagolovok: Изготовитель товара по договору
  chto: изготовитель по договору
  kak: руками; расхождение с 5-0 Передача подсвечивается
- id: Характеристики
  bukva: H
  zagolovok: Характеристики
  chto: характеристики
  kak: 'формула: с листа 5-0 Товары'
- id: СоставТехническойДокументации
  bukva: I
  zagolovok: Состав поставляемой с продукцией технической документации
  chto: какие документы должны идти с товаром — по договору и ТЗ (3.1.7)
  kak: руками; расхождение с 5-0 Передача подсвечивается
- id: ЕдИзм
  bukva: J
  zagolovok: Ед. Изм
  chto: единица измерения
  kak: 'формула: с листа 5-0 Товары'
- id: Количевство
  bukva: K
  zagolovok: Кол-во
  chto: количество
  kak: 'формула: с листа 5-0 Товары'
- id: Цена
  bukva: L
  zagolovok: Цена
  chto: 'цена за единицу (догадка: выбранная)'
  kak: формула в каждой ячейке; в выгрузке видно только заголовок — проверить, откуда цена
- id: Итого
  bukva: M
  zagolovok: Итого
  chto: количество × цена; внизу — сумма
  kak: формула
- id: Предложений
  bukva: N
  zagolovok: Предложений
  chto: сколько предложений по товару; «Мало N», если их меньше порога
  kak: 'формула: по блокам предложений'
- id: НМЦ
  bukva: O
  zagolovok: НМЦ
  chto: НМЦ за единицу
  kak: 'формула: с листа 5-0 Товары'
- id: СрокПоставкиПоДоговору
  bukva: P
  zagolovok: Срок поставки по договору
  chto: срок поставки по договору
  kak: 'формула: с листа 5-0 Товары'
- id: Запросить
  bukva: Q
  zagolovok: Запросить
  chto: 'запрашивать ли товар в повторной рассылке (догадка: замена «Повторная рассылка — Да» из 3.1.7)'
  kak: руками, из списка «Статусы запроса» (Настройки писем, столбец AL)
- id: Группа
  bukva: R
  zagolovok: Группа
  chto: 'группа: «5-1 …» — группа повторной рассылки (5-2), иначе «1-1 …» — группа контура 1'
  kak: 'формула: с листа 5-0 Товары'
- id: свободные_01
  bukva: S
  zagolovok: Доля ответов
  chto: доля ответивших поставщиков, число предложений и писем по товару (заголовки «Доля ответов», «Предложение», «Писем»)
  kak: формула на три столбца S–U — по адресам листа 5-2
- id: свободные_02
  bukva: T
  zagolovok: Предложение
  chto: число предложений (догадка)
  kak: формула столбца S
- id: свободные_03
  bukva: U
  zagolovok: Писем
  chto: число писем (догадка)
  kak: формула столбца S
- id: свободные_0?
  bukva: V…X (3)
  zagolovok: свободные
  chto: запас под новые столбцы
  kak: не заполнять
- id: РазличиеМужду
  bukva: Y
  zagolovok: РазличиеМужду
  chto: в каких полях (F–I) товар отличается от листа 5-0 Передача; результат показывает 5-0 Передача, столбец B
  kak: формула; по замечанию директора считать бы на 5-0, а показывать здесь
- id: ЦеныНачало
  bukva: Z
  zagolovok: Цены Начало
  chto: 'метка «Цены Начало»: отсюда вправо — блоки предложений'
  kak: 'не трогать: по метке формулы и скрипты находят начало или конец блока'
- id: '*.цена'
  bukva: AA…CX (26)
  zagolovok: '[почта]'
  chto: 'блок поставщика из 3 столбцов: в строке заголовков — e-mail поставщика, в строке товара — цена за единицу в рублях с НДС; аналог — столбец цены жёлтым'
  kak: руками по письмам и счетам поставщиков, как на 1-1
- id: '*.срок'
  bukva: AB…CY (26)
  zagolovok: ''
  chto: 'срок поставки: число — календарные дни, «рд» — рабочие, «н» — недели, «м» — месяцы, «в наличии» (3.1.3)'
  kak: руками
- id: '*.модель'
  bukva: AC…CZ (26)
  zagolovok: ''
  chto: 'предложенный товар: название и изготовитель'
  kak: руками
