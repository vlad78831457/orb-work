# Сгенерировано: inst/src/skripty/import_listy.py из «Копия Чистая таблица новая .xlsx». Руками не править — описание листа в index.md
# и stolbtsy.yaml рядом. Только устройство: служебные строки, заголовки, вид и списки столбцов, формулы, ссылки.
list: 1-4 1875 ОКПД2
diapazon: A1:Z310
zakrepleno: D11
karkas: false
zagolovki_ugadany: true
stroka_zagolovkov: 10
formul: 895
znacheniy: 0
spiskov: 8
uslovnyh: 8
obedineno: 0
beryot:
  1-1 Сбор КП: 891
importrange: 0
stolbtsy:
- bukva: B
  zagolovok: №
  formula: ='1-1 Сбор КП'!C2
  formula_v_stroke: 11
  formul: 300
- bukva: C
  zagolovok: 1. Заполнить наименование по ТЗ/ спецификации
  formula: ='1-1 Сбор КП'!D2
  formula_v_stroke: 11
  formul: 300
- bukva: D
  zagolovok: 2.Заполнить ОКПД2 по ТЗ (если есть описание кода, то с описанием)
  formula: ='1-1 Сбор КП'!M11
  formula_v_stroke: 20
  formul: 291
- bukva: E
  zagolovok: '3. Заполнить запрет, ограничение, преимущество, если об этом написано в Документации ЯВНО (выпадающий список: Запрет, Ограничение, Преимущество либо иное)'
  spisok: '''1-4 1875 ОКПД2''!$E$2:$E$8'
- bukva: F
  zagolovok: '4. Указать номер пункта и приложения в котором содержится код выбранный заказчиком согласно ПП РФ 1875 (ручной ввод в формате: "пункт 89 Прил 2 ")'
- bukva: G
  zagolovok: 5. Наличие Декларации заказчика об отсутсвии поз. в Реестре (выпадающий список Декларировано Да, нет)
  spisok: '''1-4 1875 ОКПД2''!$G$2:$G$8'
- bukva: H
  zagolovok: 6. Нужен ли реестровый номер для подтверждения страны происхождения (если (в позициях 1 - 145 приложения N 1 к настоящему постановлению, позициях 1 - 433 приложения N 2), то требуется, за исключением Декларированием заказчиком отсутствия в Реестре реестрового номера). (выпадающий список "Реестровый Да", "Нет", )
  spisok: '''1-4 1875 ОКПД2''!$H$2:$H$8'
- bukva: I
  zagolovok: 7. Проверить в реестрах наличие продукции, которая указана в ТЗ (для тех позиций на которые действует ограничение или запрет. (указать реестровые номер или нет)
  spisok: '''1-4 1875 ОКПД2''!$I$2:$I$8'
- bukva: J
  zagolovok: 8. Заполнить расшифровку ОКПД2.(может сделать алиса или ИИ, но надо проверять, так как часто ошибается)
- bukva: K
  zagolovok: 9. Проверить корректность выбора ОКПД2
  spisok: '''1-4 1875 ОКПД2''!$K$2:$K$8'
- bukva: L
  zagolovok: 9.1 Дать комментарий по ошибке заказчиком выбора кода
- bukva: M
  zagolovok: 10. Проверить корректность нацрежима согласно ОКПД2 по ТЗ
  spisok: '''1-4 1875 ОКПД2''!$M$2:$M$8'
- bukva: N
  zagolovok: 10.1. Определить корректный нацрежим согласно ОКПД2 из ТЗ
  spisok: '''1-4 1875 ОКПД2''!$N$2:$N$8'
- bukva: O
  zagolovok: 11. Определить правильный ОКПД2 , если он был не корректен
- bukva: P
  zagolovok: 12. Указать расшифровку корректного ОКПД 2
- bukva: Q
  zagolovok: 13. Выбрать нацрежим к корректному коду.
  spisok: '"Преимущество,Ограничение"'
- bukva: R
  zagolovok: 14. Проверить в реестрах наличие продукции, которая указана в ТЗ (для тех позиций на которые действует ограничение или запрет.
- bukva: S
  zagolovok: 15. Сделать выводы имеющие значения для расчета
