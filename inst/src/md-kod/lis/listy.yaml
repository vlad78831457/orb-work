# tablitsa — proekta (таблица проекта) | oplat (внешняя таблица оплат); kontur; chast — папка части в lis/;
# zachem — одна строка со слов директора («краткое описание листов», 2026-10-19); analog — лист-аналог другого контура;
# dogadka — что не подтверждено. Устройство листа — в lis/<chast>/struktura.yaml (make listy), описание — index.md, stolbtsy.yaml.
