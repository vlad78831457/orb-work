  bukva: A
  zagolovok: ''
  chto: служебный столбец каркаса
  kak: ''
- id: err2
  bukva: B
  zagolovok: ''
  chto: служебный столбец каркаса
  kak: ''
- id: C
  bukva: C
  zagolovok: ID_Товара
