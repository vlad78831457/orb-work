  chto: количество
  kak: 'формула: по № с листа 1-0 Товары'
- id: НацРежим
  bukva: K
  zagolovok: Нац режим 1875
  chto: нац. режим 1875
  kak: 'формула: по № с листа 1-0 Товары'
- id: НазваниеТовраДляЗапроса
  bukva: L
  zagolovok: Название товара для запроса
  chto: название товара, как оно уйдёт в письме поставщику
  kak: формула в каждой ячейке (= номенклатура); для уточнений можно вписать своё заменив формулу на текст
- id: Комментарий
  bukva: M
  zagolovok: Комментарий
  chto: комментарий к товару для письма 
  kak: руками
- id: Файлы
  bukva: N
  zagolovok: Файлы
  chto: ссылки на файлы к товару (чертежи, фото) из папки «Почтовые вложения» проекта; каждая ссылка с новой строки. Файлы с упоминанием конечного заказчика не отправлять
  kak: руками (3.1.2)
- id: Группа
  bukva: O
  zagolovok: Группа
  chto: номер группы товаров; группы разделяют две и более пустые строки
  kak: 'формула на два столбца: группа и строка в группе'
- id: СтрокаВГруппе
  bukva: P
  zagolovok: Строка в группе
  chto: 'номер строки в группе: в первую строку вносят адреса, во второй появляются уникальные адреса без повторов'
  kak: формула столбца «Группа»
- id: Ключ фразы ?
  bukva: Q…S (3)
  zagolovok: Ключ фразы 1
  chto: 'ключевые фразы для поиска поставщиков: бренд или изготовитель, вся товарная группа, как товар ищут в поисковике; действует на всю группу товара'
  kak: руками; столбцы скрыты — раскрыть (3.1.2)
- id: Свободно0?
  bukva: T…Y (6)
  zagolovok: ''
  chto: запас под новые столбцы
  kak: не заполнять
- id: ПочтыНачало
  bukva: Z
  zagolovok: ''
  chto: 'метка: отсюда вправо — адреса поставщиков'
  kak: 'не трогать: по метке формулы и скрипты находят начало или конец блока'
- id: Почта.*
  bukva: AA…AZ (26)
  zagolovok: ''
  chto: 'адреса поставщиков группы. После отправки ячейка окрашивается, в заметке — с какого адреса, на какой и когда; цвет показывает и другое: есть ответ, официальный дилер, ненадёжный поставщик (3.1.3)'
  kak: 'руками: в первую строку группы, с AA вправо; дубли можно — во второй строке останутся уникальные'
