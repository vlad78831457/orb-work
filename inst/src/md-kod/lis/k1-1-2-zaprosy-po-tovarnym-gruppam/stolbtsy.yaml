  chto: № товара в группе рассылки
  kak: 'руками: вставить значениями номера позиций с листа 1-1, с 12-й строки (строку 11 не двигать) или выбрать из списка (3.1.2)'
- id: Номенклатура
  bukva: E
  zagolovok: Номенклатура
  chto: название товара
  kak: 'формула: по № с листа 1-0 Товары'
- id: НазваниеТовараПоДоговору
  bukva: F
  zagolovok: Название товара по договору
  chto: название товара по договору
  kak: 'формула: по № с листа 1-0 Товары (столбец J)'
- id: ИзготовительТовараПоДоговору
  bukva: G
  zagolovok: Изготовитель товара по договору
  chto: изготовитель по договору
  kak: 'формула: по № с листа 1-0 Товары (столбец K)'
- id: Характеристики
  bukva: H
