# Столбцы листа «1-0 Товары»: что это (chto) и как заполняется (kak). Руками.
# id — служебное имя столбца (строка 2) или буква; id со * или ? — шаблон: одно описание на повторяющийся блок
# (сравнивается со служебным именем и заголовком). bukva и zagolovok — для ориентира, сборщик берёт их из struktura.yaml.
# Черновик 2026-10-20 по формулам, заголовкам и старым инструкциям 3.1.2–3.1.8; «(догадка)» — не подтверждено,
# «⚠» — похоже на ошибку в таблице, проверить.
- id: err
  bukva: A
  zagolovok: ''
  chto: служебный столбец каркаса (err) — для пометок строки; в чистой таблице пусто
  kak: ''
- id: err2
  bukva: B
  zagolovok: ''
  chto: служебный столбец каркаса (err2); в чистой таблице пусто
  kak: ''
- id: C
  bukva: C
  zagolovok: ID_Товара
  chto: 'ID_Товара — ключ товара (ID_T…): по нему все листы находят один и тот же товар'
  kak: 'формула: строки товаров с листа 1-1 (ищет начало и конец списка по словам-меткам, а не по номерам строк)'
- id: Номер
  bukva: D
  zagolovok: №
  chto: № позиции по спецификации тендера
  kak: 'формула на пять столбцов D–H: №, номенклатура, характеристики, ед. изм., кол-во — с листа 1-1 (столбцы C–G)'
- id: Номенклатура
  bukva: E
  zagolovok: Номенклатура
  chto: название товара из спецификации тендера
  kak: формула столбца D
- id: Характеристики
  bukva: F
  zagolovok: Характеристики
  chto: характеристики товара из спецификации
  kak: формула столбца D
- id: ЕдИзм
  bukva: G
  zagolovok: Ед. Изм
  chto: единица измерения
  kak: формула столбца D
- id: Количевство
  bukva: H
  zagolovok: Кол-во
  chto: количество
  kak: формула столбца D
- id: НМЦ
  bukva: I
  zagolovok: НМЦ
  chto: НМЦ за единицу — начальная (максимальная) цена из тендера
  kak: 'формула: с листа 1-1, столбец K «НМЦ»'
- id: НазваниеТовараПоДоговору
  bukva: J
  zagolovok: Название товара по договору
  chto: название товара, как оно записано в договоре с заказчиком
  kak: 'формула: с листа 5-1 (столбец F) по совпадению номенклатуры — появляется, когда договор уже есть'
- id: ИзготовительТовараПоДоговору
  bukva: K
  zagolovok: Изготовитель товара по договору
  chto: изготовитель, если его требует договор
  kak: 'формула: с листа 5-1 (столбец G) по совпадению номенклатуры'
- id: Группа_1_2
  bukva: L
  zagolovok: Группа
  chto: группа товаров рассылки контура 1 (листы 1-1 и 1-2)
  kak: 'формула: с листа 1-1, столбец O «Группа»'
- id: Группа_5_2
  bukva: M
  zagolovok: Группа
  chto: группа товаров повторной рассылки контура 2 (лист 5-2)
  kak: 'формула: по ID_Товара с листа 5-2, столбец N'
- id: СрокПоставкиПоДоговору
  bukva: N
  zagolovok: Срок поставки по договору
  chto: срок поставки, который требует заказчик
  kak: 'формула: с листа 1-1, столбец N'
- id: O
  bukva: O
  zagolovok: Нац режим 1875
  chto: национальный режим по постановлению № 1875 — ограничения на иностранные товары (догадка по названию)
  kak: 'формула: с листа 1-1, столбец L'
- id: P
  bukva: P
  zagolovok: Код ОКПД 2
  chto: код товара по классификатору ОКПД 2
  kak: 'формула: с листа 1-1, столбец M'
