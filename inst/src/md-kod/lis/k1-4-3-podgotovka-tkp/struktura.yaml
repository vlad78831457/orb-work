  formula: ={"Проверка ошибок";IFS(LEN(I4:I320)>0,IFS(LEN(T4:T320)=0,"Не выбрано значение в столбце Аналог",1=1,),P4:P320=0,,F4:F320=0,"НМЦ не задано",P4:P320>F4:F320,"Ошибка Цена выше НМЦ",1=1,)}
