  formula_v_stroke: 3
  formul: 302
- bukva: B
  zagolovok: Номенклатура
  formula: ="COMPUTED_VALUE"
  formula_v_stroke: 3
  formul: 1
- bukva: C
  zagolovok: Характеристики
  formula: ="COMPUTED_VALUE"
  formula_v_stroke: 3
  formul: 1
