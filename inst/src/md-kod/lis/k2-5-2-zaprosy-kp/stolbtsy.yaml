# Столбцы листа «5-2 Запросы КП Закупки»: что это (chto) и как заполняется (kak). Руками.
# id — служебное имя столбца (строка 2) или буква; id со * или ? — шаблон: одно описание на повторяющийся блок
# (сравнивается со служебным именем и заголовком). bukva и zagolovok — для ориентира, сборщик берёт их из struktura.yaml.
# Черновик 2026-10-20 по формулам, заголовкам и старым инструкциям 3.1.2–3.1.8; «(догадка)» — не подтверждено,
# «⚠» — похоже на ошибку в таблице, проверить.
- id: err
  bukva: A
  zagolovok: ''
  chto: служебный столбец каркаса
  kak: ''
- id: err2
  bukva: B
  zagolovok: ''
  chto: служебный столбец каркаса
  kak: ''
- id: C
  bukva: C
  zagolovok: ID_Товара
  chto: ID_Товара
  kak: 'формула: по № с листа 5-1'
- id: Номер
  bukva: D
  zagolovok: №
  chto: № товара в группе повторной рассылки
  kak: 'руками: из списка номеров листа 5-1 или вставкой значений'
- id: Номенклатура
  bukva: E
  zagolovok: Номенклатура
  chto: название товара
  kak: 'формула: по № с листа 5-1'
- id: НазваниеТовараПоДоговору
  bukva: F
  zagolovok: Название товара по договору
  chto: название товара по договору
  kak: 'формула: по № с листа 5-1'
- id: ИзготовительТовараПоДоговору
  bukva: G
  zagolovok: Изготовитель товара по договору
  chto: изготовитель по договору
  kak: 'формула: по № с листа 5-1'
- id: Характеристики
  bukva: H
  zagolovok: Характеристики
  chto: характеристики
  kak: 'формула: по № с листа 5-1'
- id: СоставТехническойДокументации
  bukva: I
  zagolovok: Состав поставляемой с продукцией технической документации
  chto: состав технической документации
  kak: 'формула: по № с листа 5-1'
- id: ЕдИзм
  bukva: J
  zagolovok: Ед. Изм
  chto: единица измерения
  kak: 'формула: по № с листа 5-1'
- id: Количевство
  bukva: K
  zagolovok: Кол-во
  chto: количество
  kak: 'формула: по № с листа 5-1'
- id: НазваниеТовраДляЗапроса
  bukva: L
  zagolovok: Название товара для запроса
  chto: название товара, как оно уйдёт в письме поставщику
  kak: формула в каждой ячейке (= номенклатура); для уточнений можно вписать своё (догадка)
- id: Файлы
  bukva: M
  zagolovok: Файлы
  chto: ссылки на файлы к товару; каждая с новой строки; без упоминания конечного заказчика
  kak: руками (как на 1-2)
- id: Группа
  bukva: N
  zagolovok: Группа
  chto: номер группы товаров повторной рассылки; группы разделяют две и более пустые строки
  kak: 'формула на два столбца: группа и строка в группе'
- id: СтрокаВГруппе
  bukva: O
  zagolovok: Строка в группе
  chto: 'номер строки в группе: первая — адреса, вторая — уникальные адреса'
  kak: формула столбца «Группа»
- id: Ключ фразы ?
  bukva: P…R (3)
  zagolovok: Ключ фразы 1
  chto: ключевые фразы для поиска поставщиков; действуют на всю группу
  kak: руками
- id: Свободно0?
  bukva: S…Z (8)
  zagolovok: ''
  chto: запас под новые столбцы
  kak: не заполнять
- id: ПочтыНачало
  bukva: AA
  zagolovok: ''
  chto: 'метка: отсюда вправо — адреса поставщиков'
  kak: 'не трогать: по метке формулы и скрипты находят начало или конец блока'
- id: Почта.*
  bukva: AB…BA (26)
  zagolovok: ''
  chto: адреса поставщиков группы; после отправки ячейка окрашивается, в заметке — кто, кому, когда
  kak: 'руками: в первую строку группы, с AB вправо (как на 1-2)'
