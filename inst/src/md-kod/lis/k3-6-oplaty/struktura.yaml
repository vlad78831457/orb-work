  formul: 1
- bukva: G
  formula: =LAMBDA(theData,theUrl,theEmpty, IF(theUrl="", {theEmpty;{"","","","","Нет внешней таблицы оплат. ошибка"}},IF( ISERR(theData), {theEmpty;{"","","",theData,"<< Откройте доступ ошибка"};{"","","",theUrl,"<< Внешняя таблица оплат","")
