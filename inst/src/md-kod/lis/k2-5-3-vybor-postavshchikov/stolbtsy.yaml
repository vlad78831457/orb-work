# Столбцы листа «5-3 Выбор поставщиков Закупки»: что это (chto) и как заполняется (kak). Руками.
# id — служебное имя столбца (строка 2) или буква; id со * или ? — шаблон: одно описание на повторяющийся блок
# (сравнивается со служебным именем и заголовком). bukva и zagolovok — для ориентира, сборщик берёт их из struktura.yaml.
# Черновик 2026-10-20 по формулам, заголовкам и старым инструкциям 3.1.2–3.1.8; «(догадка)» — не подтверждено,
# «⚠» — похоже на ошибку в таблице, проверить.
- id: err
  bukva: A
  zagolovok: Сделка
  chto: '«Сделка»: «Да» — товар идёт на оформление сделки (лист 5-5, через «S-10 Оформление сделок ID_Товар»)'
  kak: 'формула: «Да» у каждой строки с №'
- id: err2
  bukva: B
  zagolovok: Исключить по причине
  chto: причина исключить товар (с листа 5-0 Товары)
  kak: формула
- id: C
  bukva: C
  zagolovok: ID_Товара
  chto: ID_Товара
  kak: 'формула: с листа 5-1'
- id: Номер
  bukva: D
  zagolovok: №
  chto: № позиции
  kak: 'формула: с листа 5-1'
- id: Номенклатура
  bukva: E
  zagolovok: Номенклатура
  chto: название товара
  kak: 'формула: с листа 5-1'
- id: НазваниеТовараПоДоговору
  bukva: F
  zagolovok: Название товара по договору
  chto: название по договору
  kak: 'формула: с листа 5-1'
- id: ИзготовительТовараПоДоговору
  bukva: G
  zagolovok: Изготовитель товара по договору
  chto: изготовитель по договору
  kak: 'формула: с листа 5-1'
- id: Характеристики
  bukva: H
  zagolovok: Характеристики
  chto: характеристики
  kak: 'формула: с листа 5-1'
- id: СоставТехническойДокументации
  bukva: I
  zagolovok: Состав поставляемой с продукцией технической документации
  chto: состав технической документации
  kak: 'формула: с листа 5-1'
- id: Группа
  bukva: J
  zagolovok: Группа
  chto: группа рассылки («5-1 …» или «1-1 …»)
  kak: 'формула: с листа 5-0 Товары; ⚠ диапазон только до строки 46, у соседних — до 310'
- id: ЕдИзм
  bukva: K
  zagolovok: Изготовитель товара по договору
  chto: 'изготовитель по договору: так говорят заголовок и формула (столбец G листа 5-1)'
  kak: формула; ⚠ служебное имя «ЕдИзм» не совпадает с заголовком — проверить, что задумано
- id: Количевство
  bukva: L
  zagolovok: Кол-во
  chto: количество
  kak: 'формула: с листа 5-1'
- id: Цена
  bukva: M
  zagolovok: Цена
  chto: цена выбранного основного предложения
  kak: 'формула: по «Основному предложению» (S) с листа «S-10 Предложения»'
- id: Сумма
  bukva: N
  zagolovok: Сумма
  chto: количество × цена
  kak: формула
- id: Срок поставки
  bukva: O
  zagolovok: Срок поставки
  chto: срок поставки выбранного предложения
  kak: 'формула: как у цены'
- id: СрокПоставкиПоДоговору
  bukva: P
  zagolovok: Срок поставки по договору
  chto: срок поставки по договору
  kak: 'формула: с листа 5-1'
- id: ОснвнойПоставщик
  bukva: Q
  zagolovok: Основной Поставщик
  chto: основной поставщик — e-mail (по 3.1.7)
  kak: руками (догадка)
- id: Свободно?
  bukva: R…U (2)
  zagolovok: ''
  chto: запас под новые столбцы
  kak: не заполнять
- id: ОснвноеЛистИПредложение
  bukva: S
  zagolovok: Основное Предложение
  chto: 'какое предложение выбрано основным: лист (1-1 или 5-1) и блок поставщика'
  kak: 'руками (догадка: берут из блока топ-7, столбец «Предложение N»)'
- id: РезервныйПоставщик
  bukva: T
  zagolovok: Резервный Поставщик
  chto: резервный поставщик (по 3.1.7 его лучше выбирать всегда)
  kak: руками; столбец скрыт
- id: РезервноеЛистИПредложение
  bukva: V
  zagolovok: Резервное Предложение
  chto: 'резервное предложение: лист и блок поставщика'
  kak: руками; столбец скрыт; ⚠ в заголовке формула «Итого …» — проверить
- id: НМЦ
  bukva: W
  zagolovok: НМЦ
  chto: НМЦ за единицу
  kak: 'формула: с листа 5-1'
- id: СчетПоставщиков
  bukva: X
  zagolovok: Счет Поставщиков
  chto: счёт поставщика (догадка)
  kak: столбец скрыт — проверить, нужен ли
- id: Статус
  bukva: Y
  zagolovok: Статус
  chto: статус закупки товара — тот, что закупщик ставит на 5-5
  kak: 'формула: с листа 5-5, столбец AF; список — «Статус закупщика»'
- id: ПредполагаемаяДатаОплаты
  bukva: Z
  zagolovok: Предполагаемая дата оплаты
  chto: когда предполагается оплата
  kak: столбец скрыт — проверить, нужен ли
- id: Комментарий
  bukva: AA
  zagolovok: Комментарий
  chto: комментарий к товару при выборе поставщика; уходит на лист 5-5 (столбец AD)
  kak: руками; хранится на листе «S-10 Комментарии» (догадка)
- id: РазницаОтМиним
  bukva: AB
  zagolovok: Разница от миним
  chto: насколько цена выбранного предложения выше лучшей (место 1 топа)
  kak: 'формула: «Цена» − «Цена 1»'
- id: ИтогоРазница
  bukva: AC
  zagolovok: Итого разница
  chto: то же на всё количество
  kak: формула
- id: БлокТопНачало
  bukva: AD
  zagolovok: БлокТопНачало
  chto: 'начало блока топ-7: 7 мест по 15 столбцов; формула пишет заголовки блока'
  kak: 'не трогать: по метке формулы и скрипты находят начало или конец блока'
- id: Топ?.*.Ф
  bukva: AE…EA (42)
  zagolovok: Цена.Ф 1
  chto: скрытые столбцы блока топ-7 с формулами; видимое значение — в соседнем столбце без «.Ф»
  kak: формула; не трогать
- id: Топ?.Цена.З
  bukva: AF…DR (7)
  zagolovok: Цена 1
  chto: 'место 1–7 по цене: цена предложения (данные готовит лист «S-10 Топ 5-3», догадка)'
  kak: формула блока
- id: Топ?.Постовшик.З
  bukva: AH…DT (7)
  zagolovok: Постовшик 1
  chto: поставщик этого предложения (e-mail)
  kak: формула блока
- id: Топ?.ЛистИПредложение.З
  bukva: AJ…DV (7)
  zagolovok: Предложение 1
  chto: 'откуда предложение: лист (1-1 или 5-1) и блок поставщика'
  kak: формула блока
- id: Топ?.Комментарий.З
  bukva: AL…DX (7)
  zagolovok: Комментарий 1
  chto: комментарий к предложению
  kak: формула блока
- id: Топ?.Срок.З
  bukva: AN…DZ (7)
  zagolovok: Срок 1
  chto: срок поставки предложения
  kak: формула блока
- id: Топ?.Эксперт.З
  bukva: AP…EB (7)
  zagolovok: Эксперт 1
  chto: оценка эксперта по предложению (лист 3-2, догадка)
  kak: формула блока
- id: Топ?.Свободно_*
  bukva: AQ…EE (21)
  zagolovok: Свободно_3 1
  chto: запас под новые столбцы
  kak: не заполнять
