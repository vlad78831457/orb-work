services:
  test:
    build: tools
    image: orb-work-tools
    working_dir: /orb
    volumes:
      - .:/orb:ro
    command: ["sh", "tools/check.sh"]
  inst:
    image: pandoc/core:3.6
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /orb
    volumes:
      - .:/orb:ro
      - ./inst/dist:/orb/inst/dist
    entrypoint: ["sh", "tools/inst.sh"]
